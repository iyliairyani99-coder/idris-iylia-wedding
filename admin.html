<!DOCTYPE html>
<html lang="ms">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard RSVP</title>

<link rel="stylesheet" href="style.css">

<style>

body{

background:#f5f5f5;

padding:40px;

}

.admin{

max-width:1200px;

margin:auto;

}

.stats{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:20px;

margin-bottom:35px;

}

.box{

background:white;

padding:25px;

border-radius:20px;

text-align:center;

box-shadow:0 10px 30px rgba(0,0,0,.08);

}

.box h1{

font-size:42px;

color:#7B5B3A;

}

input{

width:100%;

padding:15px;

border-radius:15px;

border:1px solid #ddd;

margin-bottom:20px;

}

table{

width:100%;

background:white;

border-collapse:collapse;

border-radius:20px;

overflow:hidden;

}

th{

background:#8d6b52;

color:white;

padding:15px;

}

td{

padding:15px;

border-bottom:1px solid #eee;

text-align:center;

}

button{

margin-top:25px;

padding:15px 30px;

border:none;

border-radius:30px;

background:#8d6b52;

color:white;

cursor:pointer;

}

.delete-btn {
    border: none;
    background: #b83232;
    color: white;
    padding: 8px 13px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
}

.delete-btn:hover {
    opacity: 0.85;
}

.delete-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

</style>

</head>

<body>

<div class="admin">

<h1>Dashboard RSVP</h1>

<div class="stats">

<div class="box">

<h1 id="hadirPax">0</h1>

<p>Jumlah Pax Hadir</p>

</div>

<div class="box">

<h1 id="tidakHadir">0</h1>

<p>Tidak Hadir</p>

</div>

<div class="box">

<h1 id="jumlahRSVP">0</h1>

<p>Jumlah RSVP</p>

</div>

<div class="box">

<h1 id="jumlahUcapan">0</h1>

<p>Jumlah Ucapan</p>

</div>

</div>

<input
type="text"
id="search"
placeholder="Cari nama atau telefon...">

<table>

<thead>

<tr>

<th>Nama</th>

<th>Telefon</th>

<th>Pax</th>

<th>Status</th>

<th>Ucapan</th>

<th>Tindakan</th>

</tr>

</thead>

<tbody id="tableBody">

</tbody>

</table>

<button id="downloadExcel">

📥 Download Excel

</button>

</div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script type="module" src="admin.js"></script>

</body>

</html>
